[package]
name = "pure_jpegls"
description = "Pure-Rust JPEG-LS lossless codec (ISO/IEC 14495-1 / ITU-T T.87)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["jpeg-ls", "jpeg", "lossless", "codec", "compression"]
categories = ["compression", "multimedia::images"]
# Third-party test streams (CharLS/HP conformance, BSD-3) and DCMTK-generated
# fixtures stay in the repository; tests/fixtures.rs skips when they are absent.
exclude = ["tests/fixtures/charls", "tests/fixtures/dcmtk"]

# Published as `pure_jpegls`, imported as `jpegls`.
[lib]
name = "jpegls"

[dependencies]
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
